samples: 'config/samples.tsv'

root: ''
#cifs/khan_new/datasets/MIND/mouse_appmaptapoe' # can use a s3:// or gcs:// prefix to write output to cloud storage
work: ""

remote_creds: '~/.config/gcloud/application_default_credentials.json' #this is needed so we can pass creds to container

use_zipstore: False #if True, produce SPIM.ome.zarr.zip instead of SPIM.ome.zarr

#total resources available, used to set rule resources
total_cores: 32 
total_mem_mb: 500000 

#import wildcards:  tilex, tiley, channel, zslice (and prefix - unused)
import_blaze:
  raw_tif_pattern: "{prefix}_Blaze[{tilex} x {tiley}]_C{channel}_xyz-Table Z{zslice}.ome.tif"
  raw_tif_pattern_zstack:  "{prefix}_Blaze[{tilex} x {tiley}]_C{channel}.ome.tif"
  raw_tif_pattern_notile:  "{prefix}_Blaze_C{channel}_xyz-Table Z{zslice}.ome.tif"
  intensity_rescaling: 0.5 #raw images seem to be at the upper end of uint16 (over-saturated) -- causes wrapping issues when adjusting with flatfield correction etc. this rescales the raw data as it imports it..

import_prestitched:
  stitched_tif_glob: "*nm_{stain}/*.tif"
  physical_size_x_um: 1.8
  physical_size_y_um: 1.8
  physical_size_z_um: 4

  # resolution presets — override via CLI with --resolution-preset <name>
  resolution_presets:
    selma_blood_vessel:
      stitched_tif_glob: "C01/*.tif"
      physical_size_x_um: 1.625
      physical_size_y_um: 1.625
      physical_size_z_um: 3
    selma_c_fos:
      stitched_tif_glob: "C01/*.tif"
      physical_size_x_um: 1.625
      physical_size_y_um: 1.625
      physical_size_z_um: 6
    selma_cell_nucleus:
      stitched_tif_glob: "C01/*.tif"
      physical_size_x_um: 0.54
      physical_size_y_um: 0.54
      physical_size_z_um: 5
    selma_abeta:
      stitched_tif_glob: "C01/*.tif"
      physical_size_x_um: 1.63
      physical_size_y_um: 1.63
      physical_size_z_um: 4

basic_flatfield_corr:
  enabled: True
  max_n_images: 5000
  fitting_opts:
    get_darkfield: True
    smoothness_flatfield: 1.0
    smoothness_darkfield: 1.0
    sparse_cost_darkfield: 0.01

multiview_stitcher:
  registration:
    registration_binning:
      z: 2
      y: 2
      x: 2
  fusion:
    output_chunksize: 
      t: 1
      c: 1
      z: 256
      y: 256
      x: 256

  fuse_dataset:
    block_size_x: 256 # for storage
    block_size_y: 256
    block_size_z: 8
    block_size_factor_x: 1 #e.g. 2 will use 2*block_size for computation
    block_size_factor_y: 1
    block_size_factor_z: 32

ome_zarr:
  #desc: mvstitchedraw #stitchedflatcorr
  desc: mvstitchedflatcorr
  downsampling: 1 # downsampling rate (default 1 for no downsampling)
  max_downsampling_layers: 5 # e.g. 5 will produce 5 levels of downsampling by 2
  rechunk_size:
    - 1
    - 4096
    - 4096
  scaling_method: "nearest"

  omero_metadata:
    defaults:
      rdefs:
        defaultT: 0
        defaultZ: 0
        model: "color"
      id: 0
      name: "spim"
      version: "0.4"
    channels:
      defaults:
        active: True
        coefficient: 1.0
        inverted: False
        family: "linear"
        window:
          min: 0
          max: 65535
          start: 0
          end: 65535
      default_color: "00FF00"
      color_mapping:
        autof: "00FF00"
        PI: "FF0000"
        cFos: "00FF00"
        NeuN: "FF0000"
        abeta: "FFFF00"

nifti:
  levels:
    - 3
    - 4

containers:
  spimprep: null

report:
  create_report: False
  slices_along_x: 5
  slices_along_y: 5
  slices_along_z: 5 
  colormap: "gray"

dataset_description:
  raw:
    Name: "SPIM dataset"
    BIDSVersion: "1.9.0"
    DatasetType: "raw"
    License: "CC0"
  deriv:
    Name: "resampled SPIM"
    BIDSVersion: "1.9.0"
    DatasetType: "derivative"
    License: "CC0"
    GeneratedBy:
      - Name: "SPIMprep"
bids:
  raw:
    Name: Name of the dataset
    BIDSVersion: v1.9.0
    DatasetType: raw
    License: The license for the dataset
    Authors:
      - Author Name 1
    GeneratedBy:
      - Name: SPIMprep
      - Version: 0.1.0
      - CodeURL: https://github.com/khanlab/SPIMprep
  resampled:
    Name: Downsampled SPIM niftis
    BIDSVersion: v1.9.0
    DatasetType: derived
    Authors:
      - Author Name 1
    GeneratedBy:
      - Name: SPIMprep
      - Version: 0.1.0
      - CodeURL: https://github.com/khanlab/SPIMprep
  readme_md: resources/bids_template_files/README.md
  samples_json: resources/bids_template_files/samples.json

report:
  create_report: False
  flatfield_corrected:
    slice_start: 0
    slice_step: 50
    colour_map: viridis
  whole_slice_viewer:
    slice_start: 0
    slice_step: 50
    colour_map: viridis
  resources:
    readme_md: resources/qc/README.md
    vol_viewer_dir: resources/qc/volViewer
    ff_html: resources/qc/ff_html_temp.html
    report_html: resources/qc/qc_report_temp.html
    subject_html: resources/qc/subject_html_temp.html
    ws_html: resources/qc/ws_html_temp.html
